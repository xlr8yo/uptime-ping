name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping the site
        run: |
          URL="${{ vars.RENDER_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_URL repo variable not set yet — nothing to ping."
            exit 0
          fi
          curl -fsS --max-time 60 --retry 3 --retry-delay 20 "$URL/api/health"
          echo "Site is awake."

      # GitHub pauses cron workflows in repos with no commits for 60 days.
      # If the last commit is older than 50 days, push an empty one to reset
      # the clock. Uses only git — no third-party actions.
      - name: Keep the schedule alive
        run: |
          LAST=$(git log -1 --format=%ct)
          CUTOFF=$(date -d '50 days ago' +%s)
          if [ "$LAST" -lt "$CUTOFF" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: reset 60-day scheduler clock"
            git push
            echo "Pushed keepalive commit."
          else
            echo "Recent commit exists — no reset needed."
          fi
