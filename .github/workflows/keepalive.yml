name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping the site
        run: |
          URL="${{ vars.RENDER_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_URL repo variable not set yet — nothing to ping."
            exit 0
          fi
          curl -fsS --max-time 60 --retry 3 --retry-delay 20 "$URL/api/health"
          echo "Site is awake."

      # GitHub pauses cron workflows in repos with no commits for 60 days;
      # this step makes a tiny automatic commit before that happens.
      - uses: gautamkrishnar/keepalive-workflow@v2
